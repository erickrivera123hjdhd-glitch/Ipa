name: Extract ZIP

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: "ZIP file path in the repository"
        required: true
        default: "LyricbotVisualizer_iOS.zip"

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify ZIP exists
        run: |
          set -euo pipefail
          test -f "${{ inputs.zip_path }}" || {
            echo "::error::ZIP not found: ${{ inputs.zip_path }}. Upload the ZIP to the repository first."
            exit 1
          }

      - name: Extract ZIP
        run: |
          set -euo pipefail
          mkdir -p extracted
          unzip -q "${{ inputs.zip_path }}" -d extracted
          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | sort | head -200

      - name: Upload extracted files
        uses: actions/upload-artifact@v4
        with:
          name: extracted-source
          path: extracted/
          if-no-files-found: error
          retention-days: 7
