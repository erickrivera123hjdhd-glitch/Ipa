name: Extract ZIP to Repository Root

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: "ZIP path or filename; searches folders if needed"
        required: true
        default: "LyricbotVisualizer_iOS 2.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Find and verify ZIP
        id: zip
        shell: bash
        env:
          ZIP_INPUT: ${{ inputs.zip_path }}
        run: |
          set -euo pipefail
          if [ -f "$ZIP_INPUT" ]; then
            ZIP_PATH="$ZIP_INPUT"
          else
            ZIP_NAME="$(basename "$ZIP_INPUT")"
            ZIP_PATH="$(find . -type f -name "$ZIP_NAME" -not -path './.git/*' -not -path './.zip-tmp/*' -print -quit)"
          fi
          if [ -z "${ZIP_PATH:-}" ] || [ ! -f "$ZIP_PATH" ]; then
            echo "::error::ZIP not found: $ZIP_INPUT"
            echo "ZIP files found:"
            find . -type f -iname '*.zip' -not -path './.git/*' -print
            exit 1
          fi
          echo "Using ZIP: $ZIP_PATH"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          unzip -t "$ZIP_PATH"

      - name: Extract and flatten into repository root
        shell: bash
        env:
          ZIP_PATH: ${{ steps.zip.outputs.zip_path }}
        run: |
          set -euo pipefail
          TMP_DIR="$RUNNER_TEMP/ipa-zip-unpack"
          CONTENT_DIR="$RUNNER_TEMP/ipa-zip-content"
          rm -rf "$TMP_DIR" "$CONTENT_DIR" extracted
          mkdir -p "$TMP_DIR" "$CONTENT_DIR"
          unzip -q "$ZIP_PATH" -d "$TMP_DIR"

          # Remove a single wrapper directory, e.g. "fiddler wramboer".
          while true; do
            entries="$(find "$TMP_DIR" -mindepth 1 -maxdepth 1 -print)"
            count="$(printf '%s\n' "$entries" | sed '/^$/d' | wc -l | tr -d ' ')"
            if [ "$count" = "1" ] && [ -d "$entries" ]; then
              inner="$entries"
              # Stop flattening if this folder itself contains the project or source files.
              cp -R "$inner"/. "$CONTENT_DIR"/
              break
            else
              cp -R "$TMP_DIR"/. "$CONTENT_DIR"/
              break
            fi
          done

          test -n "$(find "$CONTENT_DIR" -type f -print -quit)" || {
            echo "::error::The ZIP did not contain any files"
            exit 1
          }

          echo "Copying extracted files directly into repository root..."
          # Keep Git metadata, workflow definitions, and the original ZIP intact.
          rsync -a "$CONTENT_DIR"/ ./ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='LyricbotVisualizer_iOS 2.zip' \
            --exclude='extracted/'
          echo "Files now present at repository root:"
          find . -maxdepth 2 -type f -not -path './.git/*' | sort | head -300

      - name: Commit root files and remove old extracted folder
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extracted
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No file changes to commit."
          else
            git commit -m "Extract ZIP contents into repository root"
            git push
          fi

      - name: Upload flattened source artifact
        uses: actions/upload-artifact@v4
        with:
          name: extracted-source-root
          path: ${{ runner.temp }}/ipa-zip-content/
          if-no-files-found: error
          retention-days: 7
