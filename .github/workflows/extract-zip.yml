name: Extract ZIP

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: "ZIP path or filename; searches folders if needed"
        required: true
        default: "LyricbotVisualizer_iOS 2.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Find and verify ZIP
        id: zip
        shell: bash
        env:
          ZIP_INPUT: ${{ inputs.zip_path }}
        run: |
          set -euo pipefail
          if [ -f "$ZIP_INPUT" ]; then
            ZIP_PATH="$ZIP_INPUT"
          else
            ZIP_NAME="$(basename "$ZIP_INPUT")"
            ZIP_PATH="$(find . -type f -name "$ZIP_NAME" -not -path './.git/*' -print -quit)"
          fi
          if [ -z "${ZIP_PATH:-}" ] || [ ! -f "$ZIP_PATH" ]; then
            echo "::error::ZIP not found: $ZIP_INPUT"
            find . -type f -iname '*.zip' -not -path './.git/*' -print
            exit 1
          fi
          echo "Using ZIP: $ZIP_PATH"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          unzip -t "$ZIP_PATH"

      - name: Extract and remove wrapper folder
        shell: bash
        env:
          ZIP_PATH: ${{ steps.zip.outputs.zip_path }}
        run: |
          set -euo pipefail
          rm -rf extracted .zip-tmp
          mkdir -p extracted .zip-tmp
          unzip -q "$ZIP_PATH" -d .zip-tmp
          entries="$(find .zip-tmp -mindepth 1 -maxdepth 1 -print)"
          count="$(printf '%s\n' "$entries" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "$count" = "1" ] && [ -d "$entries" ]; then
            echo "ZIP has one wrapper folder; flattening its contents."
            cp -R "$entries"/. extracted/
          else
            cp -R .zip-tmp/. extracted/
          fi
          rm -rf .zip-tmp
          echo "Extracted files:"
          find extracted -type f | sort | head -300
          test -n "$(find extracted -type f -print -quit)" || {
            echo "::error::The ZIP did not contain any files"
            exit 1
          }

      - name: Commit extracted files to repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f extracted/
          if git diff --cached --quiet; then
            echo "No extracted-file changes to commit."
          else
            git commit -m "Extract ZIP contents without wrapper folder"
            git push
          fi

      - name: Upload extracted files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: extracted-source
          path: extracted/
          if-no-files-found: error
          retention-days: 7
