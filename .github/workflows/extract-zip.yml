name: Extract uploaded ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract ZIP into a folder
        run: |
          test -f "LyricbotVisualizer_iOS.zip"
          mkdir -p "LyricbotVisualizer_iOS_extracted"
          unzip -oq "LyricbotVisualizer_iOS.zip" -d "LyricbotVisualizer_iOS_extracted"

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "LyricbotVisualizer_iOS_extracted"
          if git diff --cached --quiet; then
            echo "No extracted-file changes to commit."
          else
            git commit -m "Extract uploaded iOS ZIP"
            git push
          fi
