name: Extract ZIP into repository root

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract ZIP files without folders
        run: |
          test -f "LyricbotVisualizer_iOS.zip"
          unzip -oj "LyricbotVisualizer_iOS.zip" -d .
      
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted-file changes to commit."
          else
            git commit -m "Extract ZIP files into repository root"
            git push
          fi
