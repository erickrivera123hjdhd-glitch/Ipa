name: Extract ZIP

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: "ZIP file path in the repository"
        required: true
        default: "LyricbotVisualizer_iOS 2.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify ZIP exists
        shell: bash
        run: |
          set -euo pipefail
          ZIP_PATH="${{ inputs.zip_path }}"
          if [ ! -f "$ZIP_PATH" ]; then
            echo "::error::ZIP not found: $ZIP_PATH"
            echo "Files in repository root:"
            ls -la
            exit 1
          fi
          unzip -t "$ZIP_PATH"

      - name: Extract ZIP into repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extracted
          mkdir -p extracted
          unzip -q "${{ inputs.zip_path }}" -d extracted
          echo "Extracted files:"
          find extracted -type f | sort | head -300
          test -n "$(find extracted -type f -print -quit)" || {
            echo "::error::The ZIP did not contain any files"
            exit 1
          }

      - name: Commit extracted files to repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f extracted/
          if git diff --cached --quiet; then
            echo "No extracted-file changes to commit."
          else
            git commit -m "Extract source ZIP into repository"
            git push
          fi

      - name: Upload extracted files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: extracted-source
          path: extracted/
          if-no-files-found: error
          retention-days: 7
