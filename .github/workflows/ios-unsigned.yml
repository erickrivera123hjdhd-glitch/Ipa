name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Find and extract source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_NAME="LyricbotVisualizer_iOS 2.zip"
          ZIP_PATH="$(find . -type f -name "$ZIP_NAME" -not -path './.git/*' -print -quit)"
          if [ -z "$ZIP_PATH" ]; then
            echo "::error::Could not find $ZIP_NAME anywhere in the repository. ZIP files found:"
            find . -type f -iname '*.zip' -not -path './.git/*' -print
            exit 1
          fi
          echo "Using ZIP: $ZIP_PATH"
          mkdir -p source
          ditto -x -k "$ZIP_PATH" source
          echo "Project definitions found:"
          find source -name project.yml -type f -print

      - name: Locate project and set working directory
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(find source -name project.yml -type f -print -quit)"
          if [ -z "$candidate" ]; then
            echo "::error::No project.yml found anywhere inside the ZIP. This workflow needs an XcodeGen project.yml."
            echo "Top-level extracted files:"
            find source -maxdepth 4 -type f | sort | head -250
            exit 1
          fi
          project_dir="$(cd "$(dirname "$candidate")" && pwd)"
          echo "Using project directory: $project_dir"
          echo "SOURCE_DIR=$project_dir" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          xcodegen generate

      - name: Build unsigned app
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          PROJECT="$(find . -maxdepth 2 -name '*.xcodeproj' -type d -print -quit)"
          test -n "$PROJECT" || { echo "::error::XcodeGen did not create an .xcodeproj"; exit 1; }
          SCHEME="$(xcodegen list 2>/dev/null | head -1 | xargs || true)"
          SCHEME="${SCHEME:-LyricbotVisualizer}"
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$GITHUB_WORKSPACE/build/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -type d -print -quit)"
          test -n "$APP_PATH" || { echo "::error::Build completed but no .app bundle was found"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/package/Payload"
          cp -R "$APP_PATH" "$GITHUB_WORKSPACE/package/Payload/"
          (cd "$GITHUB_WORKSPACE/package" && zip -qr "$GITHUB_WORKSPACE/LyricbotVisualizer_unsigned.ipa" Payload)

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LyricbotVisualizer-unsigned-ipa
          path: LyricbotVisualizer_unsigned.ipa
          if-no-files-found: error
          retention-days: 14
