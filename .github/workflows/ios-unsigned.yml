name: Build unsigned iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare project sources
        shell: bash
        run: |
          set -euo pipefail

          # This repository uses XcodeGen (project.yml), not a checked-in .xcodeproj.
          if [[ ! -f project.yml ]]; then
            if [[ -f LyricbotVisualizer_iOS.zip ]]; then
              mkdir -p source
              unzip -oq LyricbotVisualizer_iOS.zip -d source
              if [[ -f source/project.yml ]]; then
                cp source/project.yml ./project.yml
              fi
            fi
          fi

          if [[ ! -f project.yml ]]; then
            echo "No project.yml found. This project needs an XcodeGen project.yml or an existing .xcodeproj/.xcworkspace."
            find . -maxdepth 5 \( -name '*.xcodeproj' -o -name '*.xcworkspace' -o -name project.yml \) -print
            exit 1
          fi

          # Recover the original folders from the ZIP when present. Some repository uploads
          # flatten the Swift files into the root, so recreate Sources in that case.
          if [[ ! -d Sources && -d source/Sources ]]; then
            cp -R source/Sources Sources
          fi
          if [[ ! -d Resources && -d source/Resources ]]; then
            cp -R source/Resources Resources
          fi
          if [[ ! -d Sources ]]; then
            mkdir -p Sources
            find . -maxdepth 1 -type f -name '*.swift' -exec cp {} Sources/ \;
          fi
          if [[ ! -d Resources ]]; then
            mkdir -p Resources
            for f in ./*.png ./*.jpg ./*.jpeg ./*.json; do
              [[ -f "$f" ]] && cp "$f" Resources/
            done
          fi

          echo "Swift sources:"
          find Sources -maxdepth 3 -type f -print
          echo "Resources:"
          find Resources -maxdepth 3 -type f -print

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build without code signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project LyricbotVisualizer.xcodeproj \
            -scheme LyricbotVisualizer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          if [[ -z "$APP_PATH" ]]; then
            echo "Build completed but no .app bundle was found."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && /usr/bin/zip -qry "$GITHUB_WORKSPACE/LyricbotVisualizer_unsigned.ipa" Payload)

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: LyricbotVisualizer-unsigned-ipa
          path: LyricbotVisualizer_unsigned.ipa
          if-no-files-found: error
